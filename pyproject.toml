[project]
name = "codediet"
version = "0.3.1"
description = "Put AI-generated code on a diet. Detects structural bloat caused by AI coding assistants."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Akshat Pal", email = "akshatpal2007@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["static-analysis", "ast", "code-diet", "refactoring", "ai-slop"]
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/AkshatPal2007/CodeDiet"
Repository = "https://github.com/AkshatPal2007/CodeDiet"


[project.scripts]
codediet = "codediet.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codediet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

