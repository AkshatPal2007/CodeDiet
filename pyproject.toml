[project]
name = "codediet"
version = "0.1.0"
description = "Put AI-generated code on a diet. Detects structural bloat caused by AI coding assistants."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "typer>=0.26.7",
]

[project.scripts]
codediet = "codediet.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codediet"]

